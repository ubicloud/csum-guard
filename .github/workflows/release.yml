name: Release

permissions:
  contents: write

# Tag a release to publish the prebuilt object:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds csum_guard.bpf.o, writes its SHA-256, and attaches both to the
# GitHub release.  rhizome pins the tag and verifies the SHA on download.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang llvm libbpf-dev linux-tools-common linux-tools-generic

      - name: Build object
        run: |
          # The BPF object is CO-RE: built once here, it relocates on the
          # target host's BTF at load, so one artifact serves every >= 6.3
          # kernel and both architectures.
          bpftool=$(ls /usr/lib/linux-tools/*/bpftool 2>/dev/null | head -1 || echo bpftool)
          "$bpftool" btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h
          make csum_guard.bpf.o
          sha256sum csum_guard.bpf.o | tee csum_guard.bpf.o.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            csum_guard.bpf.o csum_guard.bpf.o.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt csum_guard CO-RE BPF object. Verify with csum_guard.bpf.o.sha256."

      - name: Upload artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csum_guard.bpf.o
          path: |
            csum_guard.bpf.o
            csum_guard.bpf.o.sha256
